# Builds the Vexa ISO and boot-tests it in QEMU on every push and pull request.
# On the default branch, a passing build is published to GitHub Releases:
#   - "Latest build" (tag `latest-build`): replaced on every push
#   - "Vexa X.Y.Z" (tag `vX.Y.Z`): created once whenever VEXA_VERSION changes
#     (kernel/include/vexa/version.h)
name: Build and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xorriso qemu-system-x86 ovmf python3 e2fsprogs \
            musl-tools linux-libc-dev ninja-build pkg-config bison gperf \
            libglib2.0-dev-bin gtk-update-icon-cache python3-packaging
          # X.Org's packages want a newer Meson than Ubuntu's. GLib's build
          # looks for Python's "packaging" module in Meson's own environment.
          pipx install meson==1.12.1
          pipx inject meson packaging

      # The X Window System takes the longest to build: keep it (and its source
      # tarballs) between runs, until its sources or build script change.
      - name: Restore the X build
        id: x11-cache
        uses: actions/cache@v4
        with:
          path: |
            build/x11
            third_party/x11
          key: x11-${{ hashFiles('third_party/x11-sources.txt', 'tools/build-x11.sh', 'tools/musl-cc-wrapper.sh', 'tools/musl-cxx-wrapper.sh', 'third_party/xvexa/**') }}

      - name: Mark the restored X build as up to date
        if: steps.x11-cache.outputs.cache-hit == 'true'
        run: touch build/x11/.done

      - name: Build ISO (with BusyBox, bash, coreutils, Python and X, built from source)
        run: make && make busybox-source

      - name: Boot tests (BIOS, UEFI with 4 CPUs, safe mode; with test disks)
        run: |
          for f in /usr/share/qemu/OVMF.fd /usr/share/ovmf/OVMF.fd; do
            if [ -f "$f" ]; then export OVMF="$f"; break; fi
          done
          make test

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^#define VEXA_VERSION "\(.*\)"/\1/p' kernel/include/vexa/version.h)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not read VEXA_VERSION from kernel/include/vexa/version.h (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp build/vexa.iso "vexa-$version.iso"
          sha256sum "vexa-$version.iso" > "vexa-$version.iso.sha256"
          # BusyBox (GPL-2.0), bash and coreutils (GPL-3.0): every release carries
          # their exact sources; BusyBox's with its configuration.
          cp build/busybox-*-source.tar.gz third_party/bash-*.tar.xz third_party/coreutils-*.tar.xz .
          # GTK 3 and the LGPL (and MPL) libraries under it: their sources too.
          mkdir -p lgpl-sources
          cp third_party/x11/glib2.0_*.orig.tar.* third_party/x11/gtk+3.0_*.orig.tar.* \
            third_party/x11/pango1.0_*.orig.tar.* third_party/x11/gdk-pixbuf_*.orig.tar.* \
            third_party/x11/at-spi2-core_*.orig.tar.* third_party/x11/fribidi_*.orig.tar.* \
            third_party/x11/cairo_*.orig.tar.* third_party/x11/dbus_*.orig.tar.* lgpl-sources/
          tar -cf "gtk-and-lgpl-sources-$version.tar" -C lgpl-sources .

      - uses: actions/upload-artifact@v4
        with:
          name: vexa-${{ steps.version.outputs.version }}
          path: |
            vexa-${{ steps.version.outputs.version }}.iso
            vexa-${{ steps.version.outputs.version }}.iso.sha256
            busybox-*-source.tar.gz
            bash-*.tar.xz
            coreutils-*.tar.xz
            gtk-and-lgpl-sources-*.tar

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Publish one push at a time so releases from quick successive pushes don't collide.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vexa-${{ needs.build.outputs.version }}

      - name: Update "Latest build"
        run: |
          short_sha=${GITHUB_SHA::7}
          notes="Automatic build of commit ${short_sha} on \`${GITHUB_REF_NAME}\`, $(date -u '+%Y-%m-%d %H:%M UTC').

          Built and boot-tested in QEMU (BIOS, UEFI with 4 CPUs, and safe mode). This is replaced on every push; see the versioned releases for stable downloads.

          Run it with: \`qemu-system-x86_64 -M q35 -m 512M -cdrom vexa-${VERSION}.iso\`

          The ISO includes BusyBox (GPL-2.0), GNU bash and coreutils (GPL-3.0), and GTK 3 with the LGPL libraries under it; their sources are attached."
          # Move the tag to this commit, then replace the release and its files.
          git tag -f latest-build
          git push -f origin refs/tags/latest-build
          gh release delete latest-build --yes 2>/dev/null || true
          gh release create latest-build \
            --title "Latest build (${VERSION}, ${short_sha})" \
            --notes "$notes" --prerelease --latest=false \
            "vexa-${VERSION}.iso" "vexa-${VERSION}.iso.sha256" busybox-*-source.tar.gz bash-*.tar.xz coreutils-*.tar.xz gtk-and-lgpl-sources-*.tar

      - name: Create versioned release if VEXA_VERSION is new
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; bump VEXA_VERSION in kernel/include/vexa/version.h to cut a new one."
            exit 0
          fi
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            --title "Vexa ${VERSION}" --generate-notes --latest \
            "vexa-${VERSION}.iso" "vexa-${VERSION}.iso.sha256" busybox-*-source.tar.gz bash-*.tar.xz coreutils-*.tar.xz gtk-and-lgpl-sources-*.tar
