# Builds the Vexa ISO and boot-tests it in QEMU on every push and pull request.
# On the default branch, builds are published to GitHub Releases:
#   - "Nightly" (tag `nightly`): every build, as soon as it's built, before
#     the tests (so it may not work); replaced on every push
#   - "Latest build" (tag `latest-build`): the newest build that passed the
#     tests; replaced on every push
#   - "Vexa X.Y.Z" (tag `vX.Y.Z`): created once whenever VEXA_VERSION changes
#     (kernel/include/vexa/version.h)
name: Build and release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # (For the nightly release.)
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential xorriso qemu-system-x86 ovmf python3 e2fsprogs dosfstools exfatprogs mtools \
            musl-tools linux-libc-dev ninja-build pkg-config bison gperf \
            libglib2.0-dev-bin gtk-update-icon-cache python3-packaging \
            cmake flex python3-mako clang libpng-dev zlib1g-dev
          # X.Org's packages want a newer Meson than Ubuntu's. GLib's build
          # looks for Python's "packaging" module in Meson's own environment.
          pipx install meson==1.12.1
          pipx inject meson packaging

      # The X Window System takes the longest to build: keep it (and its source
      # tarballs) between runs, until its sources or build script change.
      - name: Restore the X build
        id: x11-cache
        uses: actions/cache@v4
        with:
          path: |
            build/x11
            third_party/x11
          key: x11-${{ hashFiles('third_party/x11-sources.txt', 'tools/build-x11.sh', 'tools/musl-cc-wrapper.sh', 'tools/musl-cxx-wrapper.sh', 'third_party/xvexa/**') }}

      - name: Mark the restored X build as up to date
        if: steps.x11-cache.outputs.cache-hit == 'true'
        run: touch build/x11/.done

      # OpenGL (Mesa on LLVM, tools/build-mesa.sh) takes even longer: keep the
      # result until the versions or the build script change.
      - name: Read the LLVM and Mesa versions
        id: mesa-versions
        run: |
          echo "llvm=$(sed -n 's/^LLVM_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "mesa=$(sed -n 's/^MESA_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore the OpenGL build
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: build/mesa-root
          key: mesa-${{ steps.mesa-versions.outputs.llvm }}-${{ steps.mesa-versions.outputs.mesa }}-${{ hashFiles('tools/build-mesa.sh', 'tools/musl-libcxx-wrapper.sh', 'tools/musl-cc-wrapper.sh', 'third_party/x11-sources.txt') }}

      - name: Mark the restored OpenGL build as up to date
        if: steps.mesa-cache.outputs.cache-hit == 'true'
        run: |
          # The source tarballs, dated older than the build so it isn't made
          # again (the SDK's libc++ and the native Mesa are built from them).
          make "third_party/llvm-project-${{ steps.mesa-versions.outputs.llvm }}.src.tar.xz" \
            "third_party/mesa-${{ steps.mesa-versions.outputs.mesa }}.tar.gz"
          touch -d '2000-01-01' \
            "third_party/llvm-project-${{ steps.mesa-versions.outputs.llvm }}.src.tar.xz" \
            "third_party/mesa-${{ steps.mesa-versions.outputs.mesa }}.tar.gz"
          touch build/mesa-root/.done

      # The Linux programs built from source with their libraries (Python,
      # OpenSSL, curl, ALSA): kept until their part of the Makefile changes.
      - name: Work out the key of the Linux programs' build
        id: linux-libs
        run: |
          key=$( { sed -n '/^# zlib (for Python/,/^# X: the libraries/p' Makefile
                   sed -n '/^\$(ZLIB_TARBALL):/,/^python: /p' Makefile
                   cat tools/prune-python.sh tools/musl-cc-wrapper.sh; } | sha256sum | cut -c1-20)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the Linux programs' build
        id: linux-libs-cache
        uses: actions/cache@v4
        with:
          path: |
            build/zlib
            build/libffi
            build/openssl-root
            build/curl-root
            build/alsa-root
            build/python-root
          key: linux-libs-${{ steps.linux-libs.outputs.key }}

      - name: Mark the restored Linux programs' build as up to date
        if: steps.linux-libs-cache.outputs.cache-hit == 'true'
        run: |
          # Their sources (releases carry some of them), older than the builds.
          make linux-tarballs
          touch -d '2000-01-01' third_party/*.tar.*
          touch build/zlib/lib/libz.a build/libffi/lib/libffi.a
          touch build/openssl-root/.done
          touch build/curl-root/usr/bin/curl build/alsa-root/.done build/python-root/.done

      - name: Build ISO (with BusyBox, bash, coreutils, Python and X, built from source), and the SDK
        run: make && make busybox-source && make doom-source && make netsurf-source && make sdk && make packages

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^#define VEXA_VERSION "\(.*\)"/\1/p' kernel/include/vexa/version.h)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not read VEXA_VERSION from kernel/include/vexa/version.h (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp build/vexa.iso "vexa-$version.iso"
          sha256sum "vexa-$version.iso" > "vexa-$version.iso.sha256"
          # The SDK, for building native apps (with SDL 2) on another machine.
          cp "build/vexa-sdk-$version.tar.gz" .
          # pkg's packages (published as the "packages" release).
          mkdir -p packages && cp build/packages/* packages/
          # BusyBox (GPL-2.0), bash and coreutils (GPL-3.0): every release carries
          # their exact sources; BusyBox's with its configuration.
          cp build/busybox-*-source.tar.gz third_party/bash-*.tar.xz third_party/coreutils-*.tar.xz .
          # Chocolate Doom (GPL-2.0): its source and Vexa's patch.
          cp build/chocolate-doom-*-source.tar.gz .
          # NetSurf (GPL-2.0): its source bundle and Vexa's patch.
          cp build/netsurf-*-source.tar.gz .
          # alsa-utils (GPL-2.0) and alsa-lib (LGPL-2.1): their sources too.
          cp third_party/alsa-lib-*.tar.bz2 third_party/alsa-utils-*.tar.bz2 .
          # GTK 3 and the LGPL (and MPL) libraries under it: their sources too.
          mkdir -p lgpl-sources
          cp third_party/x11/glib2.0_*.orig.tar.* third_party/x11/gtk+3.0_*.orig.tar.* \
            third_party/x11/pango1.0_*.orig.tar.* third_party/x11/gdk-pixbuf_*.orig.tar.* \
            third_party/x11/at-spi2-core_*.orig.tar.* third_party/x11/fribidi_*.orig.tar.* \
            third_party/x11/cairo_*.orig.tar.* third_party/x11/dbus_*.orig.tar.* lgpl-sources/
          tar -cf "gtk-and-lgpl-sources-$version.tar" -C lgpl-sources .

      # Published untested, straight away; the tests come next. Only from the
      # newest commit, so a slower earlier run can't replace a newer nightly.
      - name: Publish the nightly (untested)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on ${GITHUB_REF_NAME}; its run publishes the nightly."
            exit 0
          fi
          short_sha=${GITHUB_SHA::7}
          notes="Nightly build of commit ${short_sha} on \`${GITHUB_REF_NAME}\`, $(date -u '+%Y-%m-%d %H:%M UTC'), published as soon as it was built, **before the tests ran**: it may not work. \"Latest build\" and the versioned releases have passed the tests.

          Run it with: \`qemu-system-x86_64 -M q35 -m 512M -cdrom vexa-${VERSION}.iso\`

          The sources of its GPL and LGPL parts are attached."
          # (Through the releases API: the workflow's token may not move a tag with
          # git across commits that change workflow files.)
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly --target "$GITHUB_SHA" \
            --title "Nightly (${VERSION}, ${short_sha}, untested)" \
            --notes "$notes" --prerelease --latest=false \
            "vexa-${VERSION}.iso" "vexa-${VERSION}.iso.sha256" busybox-*-source.tar.gz chocolate-doom-*-source.tar.gz netsurf-*-source.tar.gz bash-*.tar.xz coreutils-*.tar.xz alsa-*.tar.bz2 gtk-and-lgpl-sources-*.tar vexa-sdk-*.tar.gz

      # GitHub's Linux runners have KVM; the tests use it when they can
      # open /dev/kvm.
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Boot tests (BIOS, UEFI with 4 CPUs, safe mode, native; at once)
        run: |
          for f in /usr/share/qemu/OVMF.fd /usr/share/ovmf/OVMF.fd; do
            if [ -f "$f" ]; then export OVMF="$f"; break; fi
          done
          make test

      - uses: actions/upload-artifact@v4
        with:
          name: vexa-${{ steps.version.outputs.version }}
          path: |
            vexa-${{ steps.version.outputs.version }}.iso
            vexa-${{ steps.version.outputs.version }}.iso.sha256
            busybox-*-source.tar.gz
            chocolate-doom-*-source.tar.gz
            netsurf-*-source.tar.gz
            bash-*.tar.xz
            coreutils-*.tar.xz
            alsa-*.tar.bz2
            gtk-and-lgpl-sources-*.tar
            vexa-sdk-*.tar.gz
            packages/*

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Publish one push at a time so releases from quick successive pushes don't collide.
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vexa-${{ needs.build.outputs.version }}

      - name: Update "Latest build"
        run: |
          short_sha=${GITHUB_SHA::7}
          notes="Automatic build of commit ${short_sha} on \`${GITHUB_REF_NAME}\`, $(date -u '+%Y-%m-%d %H:%M UTC').

          Built and boot-tested in QEMU (BIOS, UEFI with 4 CPUs, and safe mode). This is replaced on every push; see the versioned releases for stable downloads.

          Run it with: \`qemu-system-x86_64 -M q35 -m 512M -cdrom vexa-${VERSION}.iso\`

          The SDK (vexa-sdk-${VERSION}.tar.gz) builds native Vexa apps, with SDL 2, on a Linux machine: see its README.

          The ISO includes BusyBox (GPL-2.0), GNU bash and coreutils (GPL-3.0), and GTK 3 with the LGPL libraries under it; their sources are attached."
          # Move the tag to this commit, then replace the release and its files.
          # (Through the releases API: the workflow's token may not move a tag with
          # git across commits that change workflow files.)
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build --target "$GITHUB_SHA" \
            --title "Latest build (${VERSION}, ${short_sha})" \
            --notes "$notes" --prerelease --latest=false \
            "vexa-${VERSION}.iso" "vexa-${VERSION}.iso.sha256" busybox-*-source.tar.gz chocolate-doom-*-source.tar.gz bash-*.tar.xz coreutils-*.tar.xz alsa-*.tar.bz2 gtk-and-lgpl-sources-*.tar vexa-sdk-*.tar.gz

      - name: Update the packages (what pkg and the Software app install)
        run: |
          gh release delete packages --yes --cleanup-tag 2>/dev/null || true
          gh release create packages --target "$GITHUB_SHA" \
            --title "Packages" \
            --notes "Apps for Vexa's package manager (pkg) and the Software app: index.conf lists them, with each zip's SHA-256. Replaced on every push." \
            --prerelease --latest=false packages/*

      - name: Create versioned release if VEXA_VERSION is new
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; bump VEXA_VERSION in kernel/include/vexa/version.h to cut a new one."
            exit 0
          fi
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            --title "Vexa ${VERSION}" --generate-notes --latest \
            "vexa-${VERSION}.iso" "vexa-${VERSION}.iso.sha256" busybox-*-source.tar.gz chocolate-doom-*-source.tar.gz bash-*.tar.xz coreutils-*.tar.xz alsa-*.tar.bz2 gtk-and-lgpl-sources-*.tar vexa-sdk-*.tar.gz
