<!doctype html>
<meta charset="utf-8">
<title>New Tab</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg1: #e8f6fb; --bg2: #bfe3f0; --ink: #12394d; --dim: #4f7a8c;
    --card: rgba(255, 255, 255, .72); --line: #a9d3e3; --accent: #1b7fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #1d2529; --bg2: #11181b; --ink: #e4f1f6; --dim: #8fa8b3;
      --card: rgba(255, 255, 255, .07); --line: #33454d; --accent: #5cc4e4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink); font: 16px/1.4 sans-serif;
  }
  h1 { margin: 0 0 6px; font-size: 56px; font-weight: bold; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  p.tag { margin: 0 0 34px; color: var(--dim); }
  form { width: min(560px, 86vw); }
  input {
    width: 100%; padding: 13px 18px; font-size: 17px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 24px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .links { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; justify-content: center; }
  .links a {
    display: block; width: 120px; padding: 14px 8px; text-align: center; text-decoration: none;
    color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .links a b { display: block; font-size: 22px; color: var(--accent); }
  .links a small { color: var(--dim); }
  footer { position: absolute; bottom: 14px; color: var(--dim); font-size: 13px; }
</style>
<h1>Va<span>n</span>e</h1>
<p class="tag">A web browser for Vexa</p>
<form action="https://html.duckduckgo.com/html/" method="get">
  <input name="q" type="text" placeholder="Search the web" autofocus>
</form>
<div class="links">
  <a href="https://en.wikipedia.org/"><b>W</b>Wikipedia<br><small>wikipedia.org</small></a>
  <a href="https://servo.org/"><b>S</b>Servo<br><small>servo.org</small></a>
  <a href="https://www.rust-lang.org/"><b>R</b>Rust<br><small>rust-lang.org</small></a>
  <a href="https://news.ycombinator.com/"><b>H</b>Hacker News<br><small>ycombinator.com</small></a>
</div>
<footer>Ctrl+T new tab &middot; Ctrl+L address &middot; Ctrl+W close tab</footer>
