timeout: 3

# The Makefile adds a module_path line for the initramfs (the starting root
# file system, with the programs) after every kernel path line; see
# build/limine.conf.

/Vexa
    protocol: limine
    path: boot():/boot/vexa-kernel

/Vexa (safe mode: no ACPI, legacy PIC and PIT)
    protocol: limine
    path: boot():/boot/vexa-kernel
    cmdline: acpi=off noapic
