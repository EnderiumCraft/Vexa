timeout: 3

# The Makefile adds a module_path line for each program in userland/ after
# every kernel path line, so the kernel can run them (see build/limine.conf).

/Vexa
    protocol: limine
    path: boot():/boot/vexa-kernel

/Vexa (safe mode: no ACPI, legacy PIC and PIT)
    protocol: limine
    path: boot():/boot/vexa-kernel
    cmdline: acpi=off noapic
