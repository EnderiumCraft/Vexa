# Xorg on Vexa: the whole screen through DRM (the modesetting driver, drawing
# into a shadow frame buffer), the keyboard and mouse through evdev. Start it
# from the console (not from the desktop, which has the screen): `startxorg`.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "card"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "screen"
    Device "card"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection
